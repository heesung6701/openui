# Chosen per instance by the card's `style` mode prop (modifier without a condition).

card:
  container-color: { $type: color, $value: "{md.comp.outlined-card.container-color}" }
  shadow: { $type: shadow, $value: "{md.sys.elevation-shadow.level0}" }
  hover-shadow: { $type: shadow, $value: "{md.sys.elevation-shadow.level1}" }
  outline-color: { $type: color, $value: "{md.comp.outlined-card.outline-color}" }
  outline-width: { $type: dimension, $value: "{md.comp.outlined-card.outline-width}" }
  focus-outline-color: { $type: color, $value: "{md.comp.outlined-card.focus-outline-color}" }
  disabled-container-color: { $type: color, $value: "{md.comp.outlined-card.container-color}" }
  disabled-container-opacity: { $type: number, $value: "{md.sys.opacity.full}" }
  disabled-outline-color: { $type: color, $value: "{md.comp.outlined-card.disabled-outline-color}" }
  disabled-outline-opacity: { $type: number, $value: "{md.comp.outlined-card.disabled-outline-opacity}" }
