# System-level values M3 uses that material-web v0.192 does not ship as tokens (names follow its conventions).
# Component-specific values live in each component's data.tokens.
md:
  sys:
    color:
      transparent: { $type: color, $value: { colorSpace: srgb, components: [0, 0, 0], alpha: 0 } }
    space:
      zero: { $type: dimension, $value: { value: 0, unit: px } }
    opacity:
      $type: number
      zero: { $value: 0 }
      full: { $value: 1 }
