# Chosen per instance by the card's `style` mode prop (modifier without a condition).

card:
  container-color: { $type: color, $value: "{md.comp.filled-card.container-color}" }
  shadow: { $type: shadow, $value: "{md.sys.elevation-shadow.level0}" }
  hover-shadow: { $type: shadow, $value: "{md.sys.elevation-shadow.level1}" }
  outline-color: { $type: color, $value: "{md.sys.color.transparent}" }
  outline-width: { $type: dimension, $value: "{md.sys.space.zero}" }
  focus-outline-color: { $type: color, $value: "{md.sys.color.transparent}" }
  disabled-container-color: { $type: color, $value: "{md.comp.filled-card.disabled-container-color}" }
  disabled-container-opacity: { $type: number, $value: "{md.comp.filled-card.disabled-container-opacity}" }
  disabled-outline-color: { $type: color, $value: "{md.sys.color.transparent}" }
  disabled-outline-opacity: { $type: number, $value: "{md.sys.opacity.zero}" }
