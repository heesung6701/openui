# Chosen per instance by the checkbox's `error` mode prop (modifier without a condition).

checkbox:
  unselected-outline-color: { $type: color, $value: "{md.comp.checkbox.unselected-outline-color}" }
  unselected-hover-outline-color: { $type: color, $value: "{md.comp.checkbox.unselected-hover-outline-color}" }
  unselected-focus-outline-color: { $type: color, $value: "{md.comp.checkbox.unselected-focus-outline-color}" }
  unselected-pressed-outline-color: { $type: color, $value: "{md.comp.checkbox.unselected-pressed-outline-color}" }
  unselected-hover-state-layer-color: { $type: color, $value: "{md.comp.checkbox.unselected-hover-state-layer-color}" }
  unselected-pressed-state-layer-color: { $type: color, $value: "{md.comp.checkbox.unselected-pressed-state-layer-color}" }
  selected-hover-state-layer-color: { $type: color, $value: "{md.comp.checkbox.selected-hover-state-layer-color}" }
  selected-pressed-state-layer-color: { $type: color, $value: "{md.comp.checkbox.selected-pressed-state-layer-color}" }
  selected-container-color: { $type: color, $value: "{md.comp.checkbox.selected-container-color}" }
  selected-icon-color: { $type: color, $value: "{md.comp.checkbox.selected-icon-color}" }
