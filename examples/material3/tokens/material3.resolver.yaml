version: "2025.10"
name: Material 3 (material-web v0.192)
description: >
  Foundations only (ref, sys, theme colors, text). Component tokens live in each component's data.tokens;
  per-instance choices (button style, checkbox error) are mode props there.
sets:
  ref:   { sources: [{ $ref: ref.tokens.yaml }] }
  sys:   { sources: [{ $ref: sys.tokens.yaml }, { $ref: elevation.tokens.yaml }] }
  extra: { sources: [{ $ref: extra.tokens.yaml }] }
modifiers:
  theme:
    description: Color scheme
    contexts:
      light: [{ $ref: sys-color-light.tokens.yaml }]
      dark:  [{ $ref: sys-color-dark.tokens.yaml }]
    default: light
    $extensions:
      org.openui: { when: { light: { colorScheme: light }, dark: { colorScheme: dark } } }
  locale:
    description: UI language (BCP 47). Holds the text tokens.
    contexts:
      en: [{ $ref: text.en.tokens.yaml }]
      ko: [{ $ref: text.ko.tokens.yaml }]
    default: en
    $extensions:
      org.openui: { when: { en: { language: en }, ko: { language: ko } } }
resolutionOrder:
  - { $ref: "#/sets/ref" }
  - { $ref: "#/sets/sys" }
  - { $ref: "#/modifiers/theme" }
  - { $ref: "#/sets/extra" }
  - { $ref: "#/modifiers/locale" }
