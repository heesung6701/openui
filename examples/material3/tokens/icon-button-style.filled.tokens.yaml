# Chosen per instance by the icon button's `style` mode prop (modifier without a condition).

icon-button:
  container-color: { $type: color, $value: "{md.comp.filled-icon-button.container-color}" }
  icon-color: { $type: color, $value: "{md.comp.filled-icon-button.icon-color}" }
  state-layer-color: { $type: color, $value: "{md.comp.filled-icon-button.hover-state-layer-color}" }
  pressed-state-layer-color: { $type: color, $value: "{md.comp.filled-icon-button.hover-state-layer-color}" }
  pressed-icon-color: { $type: color, $value: "{md.comp.filled-icon-button.icon-color}" }
  focus-state-layer-opacity: { $type: number, $value: "{md.comp.filled-icon-button.focus-state-layer-opacity}" }
  outline-color: { $type: color, $value: "{md.sys.color.transparent}" }
  outline-width: { $type: dimension, $value: "{md.sys.space.zero}" }
  disabled-container-color: { $type: color, $value: "{md.comp.filled-icon-button.disabled-container-color}" }
  disabled-container-opacity: { $type: number, $value: "{md.comp.filled-icon-button.disabled-container-opacity}" }
  disabled-outline-color: { $type: color, $value: "{md.sys.color.transparent}" }
  disabled-outline-opacity: { $type: number, $value: "{md.sys.opacity.zero}" }
