# yaml-language-server: $schema=../../../schema/component.schema.json
# M3 checkbox, material-web v0.192 tokens. `type` is a variant (it shows the check or dash icon);
# error only changes colors, so it is a mode prop (tokens/checkbox-error.*.tokens.yaml).
kind: Component
metadata:
  id: checkbox
  name: Checkbox
  description: "M3 checkbox. The check glyph uses Material Icons `check`, not M3's custom check-mark path."
data:
  props:
    error: { type: mode, modifier: checkbox-error, description: "\"true\" shows error colors (token mode; the UI tree is the same)" }
  variants:
    type:
      values:
        unselected:    {}
        selected:      {}
        indeterminate: { description: "Partially selected (parent of mixed children)" }
      default: unselected
  states: [enabled, hovered, focused, pressed, disabled]
  anatomy:
    root:
      kind: frame
      layout: { direction: none, width: "{md.comp.checkbox.state-layer-size}", height: "{md.comp.checkbox.state-layer-size}" }
      children:
        stateLayer: { kind: frame, layout: { position: absolute, width: fill, height: fill } }
        container:  { kind: frame, layout: { x: "{md.comp.checkbox.container-offset}", y: "{md.comp.checkbox.container-offset}", width: "{md.comp.checkbox.container-size}", height: "{md.comp.checkbox.container-size}" } }
        check:      { kind: instance, component: icon-check }
        dash:       { kind: instance, component: icon-remove }
  styles:
    # type changes the UI tree (check / dash icons); error colors come from the checkbox-error token mode
    base:
      enabled:
        root:       { fill: "{md.sys.color.transparent}" }
        stateLayer: { cornerRadius: "{md.comp.checkbox.state-layer-shape}", opacity: "{md.sys.opacity.zero}", fill: "{checkbox.unselected-hover-state-layer-color}" }
        container:  { cornerRadius: "{md.comp.checkbox.container-shape}", fill: "{md.sys.color.transparent}", strokeColor: "{checkbox.unselected-outline-color}", strokeWidth: "{md.comp.checkbox.unselected-outline-width}" }
        check:      { x: "{md.comp.checkbox.container-offset}", y: "{md.comp.checkbox.container-offset}", width: "{md.comp.checkbox.icon-size}", height: "{md.comp.checkbox.icon-size}", visible: false, fill: "{checkbox.selected-icon-color}" }
        dash:       { x: "{md.comp.checkbox.container-offset}", y: "{md.comp.checkbox.container-offset}", width: "{md.comp.checkbox.icon-size}", height: "{md.comp.checkbox.icon-size}", visible: false, fill: "{checkbox.selected-icon-color}" }
      hovered:
        stateLayer: { opacity: "{md.comp.checkbox.unselected-hover-state-layer-opacity}" }
        container:  { strokeColor: "{checkbox.unselected-hover-outline-color}" }
      focused:
        stateLayer: { opacity: "{md.comp.checkbox.unselected-focus-state-layer-opacity}" }
        container:  { strokeColor: "{checkbox.unselected-focus-outline-color}" }
      pressed:
        stateLayer: { opacity: "{md.comp.checkbox.unselected-pressed-state-layer-opacity}", fill: "{checkbox.unselected-pressed-state-layer-color}" }
        container:  { strokeColor: "{checkbox.unselected-pressed-outline-color}" }
      disabled:
        container: { strokeColor: "{md.comp.checkbox.unselected-disabled-outline-color}", strokeOpacity: "{md.comp.checkbox.unselected-disabled-container-opacity}" }

    # selected and indeterminate share container styling (spec v0.1 has no OR in variant expressions)
    type=selected:
      enabled:
        stateLayer: { fill: "{checkbox.selected-hover-state-layer-color}" }
        container:  { fill: "{checkbox.selected-container-color}", strokeWidth: "{md.comp.checkbox.selected-outline-width}" }
        check:      { visible: true }
      pressed:
        stateLayer: { fill: "{checkbox.selected-pressed-state-layer-color}" }
      disabled:
        container: { fill: "{md.comp.checkbox.selected-disabled-container-color}", fillOpacity: "{md.comp.checkbox.selected-disabled-container-opacity}" }
        check:     { fill: "{md.comp.checkbox.selected-disabled-icon-color}" }
    type=indeterminate:
      enabled:
        stateLayer: { fill: "{checkbox.selected-hover-state-layer-color}" }
        container:  { fill: "{checkbox.selected-container-color}", strokeWidth: "{md.comp.checkbox.selected-outline-width}" }
        dash:       { visible: true }
      pressed:
        stateLayer: { fill: "{checkbox.selected-pressed-state-layer-color}" }
      disabled:
        container: { fill: "{md.comp.checkbox.selected-disabled-container-color}", fillOpacity: "{md.comp.checkbox.selected-disabled-container-opacity}" }
        dash:      { fill: "{md.comp.checkbox.selected-disabled-icon-color}" }
