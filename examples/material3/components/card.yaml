# yaml-language-server: $schema=../../../schema/component.schema.json
# M3 cards (elevated / filled / outlined), material-web v0.192 tokens. Content is a slot.
# One UI tree for all styles: `style` is a mode prop (tokens/card-style.*.tokens.yaml), not a variant.
kind: Component
metadata:
  id: card
  name: Card
  description: M3 card container. Layout inside the card is up to the slot content.
data:
  props:
    content: { type: slot, min: 1, description: "Card content (media, text, actions)" }
    style:   { type: mode, modifier: card-style, description: "elevated | filled | outlined (token mode)" }
  states: [enabled, hovered, focused, pressed, disabled]
  anatomy:
    root:
      kind: frame
      layout: { direction: column, gap: "{md.comp.card.content-gap}", padding: "{md.comp.card.padding}", width: "{md.comp.card.preview-width}", height: hug }
      children:
        stateLayer: { kind: frame, layout: { position: absolute, width: fill, height: fill } }
        body:       { kind: slot, prop: content, layout: { direction: column, gap: "{md.comp.card.content-gap}", width: fill } }
  styles:
    base:
      enabled:
        root:       { fill: "{card.container-color}", cornerRadius: "{md.comp.elevated-card.container-shape}", strokeColor: "{card.outline-color}", strokeWidth: "{card.outline-width}", shadow: "{card.shadow}" }
        stateLayer: { cornerRadius: "{md.comp.elevated-card.container-shape}", opacity: "{md.sys.opacity.zero}", fill: "{md.comp.elevated-card.hover-state-layer-color}" }
      hovered:
        root:       { shadow: "{card.hover-shadow}" }
        stateLayer: { opacity: "{md.comp.elevated-card.hover-state-layer-opacity}" }
      focused:
        root:       { strokeColor: "{card.focus-outline-color}" }
        stateLayer: { opacity: "{md.comp.elevated-card.focus-state-layer-opacity}" }
      pressed:
        stateLayer: { opacity: "{md.comp.elevated-card.pressed-state-layer-opacity}" }
      disabled:
        root: { fill: "{card.disabled-container-color}", fillOpacity: "{card.disabled-container-opacity}", strokeColor: "{card.disabled-outline-color}", strokeOpacity: "{card.disabled-outline-opacity}" }
