# yaml-language-server: $schema=../../../schema/component.schema.json
# M3 common buttons (filled / outlined / text / elevated / filled tonal), material-web v0.192 tokens.
# The five styles share one UI tree, so `style` is a mode prop: every per-style value is a `button.*` token whose
# value per style lives in tokens/button-style.*.tokens.yaml. Only withIcon (adds the icon part) is a variant.
kind: Component
metadata:
  id: button
  name: Button
  description: M3 common button. Spacing values not in material-web v0.192 tokens are in tokens/extra.tokens.yaml and button-style.*.
data:
  props:
    label: { type: text, default: "{text.button.label}" }
    style: { type: mode, modifier: button-style, description: "filled | outlined | text | elevated | tonal. Only token values differ, so it is a mode, not a variant" }
    icon:  { type: instance, default: icon-add, preferred: [icon-add, icon-star], description: Leading icon (withIcon=true) }
  variants:
    withIcon:
      values: { "false": {}, "true": { description: "Leading icon shown; leading padding shrinks" } }
      default: "false"
  states: [enabled, hovered, focused, pressed, disabled]
  anatomy:
    root:
      kind: frame
      layout:
        direction: row
        gap: "{md.comp.button.icon-label-space}"
        padding: ["{md.sys.space.zero}", "{button.trailing-space}", "{md.sys.space.zero}", "{button.leading-space}"]
        align: { main: center, cross: center }
        width: hug
        height: "{md.comp.filled-button.container-height}"
      children:
        stateLayer: { kind: frame, layout: { position: absolute, width: fill, height: fill } }
        icon:       { kind: instance, prop: icon }
        label:      { kind: text, text: { prop: label } }
  styles:
    base:
      enabled:
        root:       { fill: "{button.container-color}", cornerRadius: "{md.comp.filled-button.container-shape}", shadow: "{button.shadow}", strokeColor: "{button.outline-color}", strokeWidth: "{button.outline-width}" }
        stateLayer: { fill: "{button.state-layer-color}", cornerRadius: "{md.comp.filled-button.container-shape}", opacity: "{md.sys.opacity.zero}" }
        icon:       { fill: "{button.icon-color}", width: "{md.comp.filled-button.with-icon-icon-size}", height: "{md.comp.filled-button.with-icon-icon-size}" }
        label:      { color: "{button.label-color}", typography: "{md.sys.typescale.label-large}" }
      hovered:
        root:       { shadow: "{button.hover-shadow}" }
        stateLayer: { opacity: "{md.comp.filled-button.hover-state-layer-opacity}" }
      focused:
        root:       { strokeColor: "{button.focus-outline-color}" }
        stateLayer: { opacity: "{md.comp.filled-button.focus-state-layer-opacity}" }
      pressed:
        stateLayer: { opacity: "{md.comp.filled-button.pressed-state-layer-opacity}" }
      disabled:
        root:  { fill: "{button.disabled-container-color}", fillOpacity: "{button.disabled-container-opacity}", shadow: "{button.disabled-shadow}", strokeColor: "{button.disabled-outline-color}", strokeOpacity: "{button.disabled-outline-opacity}" }
        label: { color: "{md.comp.filled-button.disabled-label-text-color}", opacity: "{md.comp.filled-button.disabled-label-text-opacity}" }
        icon:  { fill: "{md.comp.filled-button.with-icon-disabled-icon-color}", fillOpacity: "{md.comp.filled-button.with-icon-disabled-icon-opacity}" }

    # withIcon changes the UI tree (the icon part), so it is a variant; its padding values are tokens too
    withIcon=false:
      enabled:
        icon: { visible: false }
    withIcon=true:
      enabled:
        root: { padding: ["{md.sys.space.zero}", "{button.with-icon-trailing-space}", "{md.sys.space.zero}", "{button.with-icon-leading-space}"] }
