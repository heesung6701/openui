# yaml-language-server: $schema=../../../schema/component.schema.json
# M3 filter chip (flat), material-web v0.192 tokens. Padding from material-web chip CSS (no padding tokens).
kind: Component
metadata:
  id: filter-chip
  name: Filter chip
  description: M3 flat filter chip. Elevated chips and the dragged state are out of scope for the pilot.
data:
  props:
    label: { type: text, default: "{text.filter-chip.label}" }
  variants:
    selected:
      values: { "false": {}, "true": { description: "Selected: tonal container and leading check" } }
      default: "false"
  states: [enabled, hovered, focused, pressed, disabled]
  # The tokens this component uses ("{filter-chip.<name>}"), values from material-web v0.192 component tokens.
  tokens:
    icon-label-space: { $type: dimension, $value: { value: 8, unit: px } }
    block-space: { $type: dimension, $value: "{md.sys.space.zero}" }
    trailing-space: { $type: dimension, $value: { value: 16, unit: px } }
    leading-space: { $type: dimension, $value: { value: 16, unit: px } }
    container-height: { $type: dimension, $value: { value: 32, unit: px } }
    unselected-container-color: { $type: color, $value: "{md.sys.color.transparent}" }
    container-shape: { $type: dimension, $value: "{md.sys.shape.corner-small}" }
    flat-unselected-outline-color: { $type: color, $value: "{md.sys.color.outline}" }
    flat-unselected-outline-width: { $type: dimension, $value: { value: 1, unit: px } }
    enabled-state-layer-opacity: { $type: number, $value: "{md.sys.opacity.zero}" }
    unselected-hover-state-layer-color: { $type: color, $value: "{md.sys.color.on-surface-variant}" }
    with-icon-icon-size: { $type: dimension, $value: { value: 18, unit: px } }
    with-leading-icon-selected-leading-icon-color: { $type: color, $value: "{md.sys.color.on-secondary-container}" }
    label-text-typography: { $type: typography, $value: "{md.sys.typescale.label-large}" }
    unselected-label-text-color: { $type: color, $value: "{md.sys.color.on-surface-variant}" }
    unselected-hover-state-layer-opacity: { $type: number, $value: "{md.sys.state.hover-state-layer-opacity}" }
    flat-unselected-focus-outline-color: { $type: color, $value: "{md.sys.color.on-surface-variant}" }
    unselected-focus-state-layer-opacity: { $type: number, $value: "{md.sys.state.focus-state-layer-opacity}" }
    unselected-pressed-state-layer-opacity: { $type: number, $value: "{md.sys.state.pressed-state-layer-opacity}" }
    unselected-pressed-state-layer-color: { $type: color, $value: "{md.sys.color.on-secondary-container}" }
    flat-disabled-unselected-outline-color: { $type: color, $value: "{md.sys.color.on-surface}" }
    flat-disabled-unselected-outline-opacity: { $type: number, $value: 0.12 }
    disabled-label-text-color: { $type: color, $value: "{md.sys.color.on-surface}" }
    disabled-label-text-opacity: { $type: number, $value: 0.38 }
    with-leading-icon-disabled-leading-icon-color: { $type: color, $value: "{md.sys.color.on-surface}" }
    with-leading-icon-disabled-leading-icon-opacity: { $type: number, $value: 0.38 }
    flat-selected-container-color: { $type: color, $value: "{md.sys.color.secondary-container}" }
    flat-selected-outline-width: { $type: dimension, $value: { value: 0, unit: px } }
    with-leading-icon-leading-space: { $type: dimension, $value: { value: 8, unit: px } }
    selected-hover-state-layer-color: { $type: color, $value: "{md.sys.color.on-secondary-container}" }
    selected-label-text-color: { $type: color, $value: "{md.sys.color.on-secondary-container}" }
    selected-pressed-state-layer-color: { $type: color, $value: "{md.sys.color.on-surface-variant}" }
    flat-disabled-selected-container-color: { $type: color, $value: "{md.sys.color.on-surface}" }
    flat-disabled-selected-container-opacity: { $type: number, $value: 0.12 }
  anatomy:
    root:
      kind: frame
      layout:
        direction: row
        gap: "{filter-chip.icon-label-space}"
        padding: ["{filter-chip.block-space}", "{filter-chip.trailing-space}", "{filter-chip.block-space}", "{filter-chip.leading-space}"]
        align: { main: center, cross: center }
        width: hug
        height: "{filter-chip.container-height}"
      children:
        stateLayer: { kind: frame, layout: { position: absolute, width: fill, height: fill } }
        leading:    { kind: instance, component: icon-check }
        label:      { kind: text, text: { prop: label } }
  styles:
    base:
      enabled:
        root:       { fill: "{filter-chip.unselected-container-color}", cornerRadius: "{filter-chip.container-shape}", strokeColor: "{filter-chip.flat-unselected-outline-color}", strokeWidth: "{filter-chip.flat-unselected-outline-width}" }
        stateLayer: { cornerRadius: "{filter-chip.container-shape}", opacity: "{filter-chip.enabled-state-layer-opacity}", fill: "{filter-chip.unselected-hover-state-layer-color}" }
        leading:    { visible: false, width: "{filter-chip.with-icon-icon-size}", height: "{filter-chip.with-icon-icon-size}", fill: "{filter-chip.with-leading-icon-selected-leading-icon-color}" }
        label:      { typography: "{filter-chip.label-text-typography}", color: "{filter-chip.unselected-label-text-color}" }
      hovered:
        stateLayer: { opacity: "{filter-chip.unselected-hover-state-layer-opacity}" }
      focused:
        root:       { strokeColor: "{filter-chip.flat-unselected-focus-outline-color}" }
        stateLayer: { opacity: "{filter-chip.unselected-focus-state-layer-opacity}" }
      pressed:
        stateLayer: { opacity: "{filter-chip.unselected-pressed-state-layer-opacity}", fill: "{filter-chip.unselected-pressed-state-layer-color}" }
      disabled:
        root:    { strokeColor: "{filter-chip.flat-disabled-unselected-outline-color}", strokeOpacity: "{filter-chip.flat-disabled-unselected-outline-opacity}" }
        label:   { color: "{filter-chip.disabled-label-text-color}", opacity: "{filter-chip.disabled-label-text-opacity}" }
        leading: { fill: "{filter-chip.with-leading-icon-disabled-leading-icon-color}", fillOpacity: "{filter-chip.with-leading-icon-disabled-leading-icon-opacity}" }
    selected=true:
      enabled:
        root:       { fill: "{filter-chip.flat-selected-container-color}", strokeWidth: "{filter-chip.flat-selected-outline-width}", padding: ["{filter-chip.block-space}", "{filter-chip.trailing-space}", "{filter-chip.block-space}", "{filter-chip.with-leading-icon-leading-space}"] }
        stateLayer: { fill: "{filter-chip.selected-hover-state-layer-color}" }
        leading:    { visible: true }
        label:      { color: "{filter-chip.selected-label-text-color}" }
      pressed:
        stateLayer: { fill: "{filter-chip.selected-pressed-state-layer-color}" }
      disabled:
        root: { fill: "{filter-chip.flat-disabled-selected-container-color}", fillOpacity: "{filter-chip.flat-disabled-selected-container-opacity}" }
