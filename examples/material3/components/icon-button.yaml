# yaml-language-server: $schema=../../../schema/component.schema.json
# M3 icon buttons (standard / filled / filled tonal / outlined), unselected (non-toggle) form, material-web v0.192 tokens.
# One UI tree for all styles: `style` is a mode prop (tokens/icon-button-style.*.tokens.yaml), not a variant.
kind: Component
metadata:
  id: icon-button
  name: Icon button
  description: M3 icon button, non-toggle. Toggle (selected) variants are out of scope for the pilot.
data:
  props:
    icon: { type: instance, default: icon-star, preferred: [icon-star, icon-add] }
    style: { type: mode, modifier: icon-button-style, description: "standard | filled | tonal | outlined (token mode)" }
  states: [enabled, hovered, focused, pressed, disabled]
  anatomy:
    root:
      kind: frame
      layout:
        direction: row
        align: { main: center, cross: center }
        width: "{md.comp.filled-icon-button.container-width}"
        height: "{md.comp.filled-icon-button.container-height}"
      children:
        stateLayer: { kind: frame, layout: { position: absolute, width: fill, height: fill } }
        icon:       { kind: instance, prop: icon }
  styles:
    base:
      enabled:
        root:       { fill: "{icon-button.container-color}", cornerRadius: "{md.comp.filled-icon-button.container-shape}", strokeColor: "{icon-button.outline-color}", strokeWidth: "{icon-button.outline-width}" }
        stateLayer: { fill: "{icon-button.state-layer-color}", cornerRadius: "{md.comp.icon-button.state-layer-shape}", opacity: "{md.sys.opacity.zero}" }
        icon:       { fill: "{icon-button.icon-color}", width: "{md.comp.icon-button.icon-size}", height: "{md.comp.icon-button.icon-size}" }
      hovered:
        stateLayer: { opacity: "{md.comp.filled-icon-button.hover-state-layer-opacity}" }
      focused:
        stateLayer: { opacity: "{icon-button.focus-state-layer-opacity}" }
      pressed:
        stateLayer: { opacity: "{md.comp.filled-icon-button.pressed-state-layer-opacity}", fill: "{icon-button.pressed-state-layer-color}" }
        icon:       { fill: "{icon-button.pressed-icon-color}" }
      disabled:
        root: { fill: "{icon-button.disabled-container-color}", fillOpacity: "{icon-button.disabled-container-opacity}", strokeColor: "{icon-button.disabled-outline-color}", strokeOpacity: "{icon-button.disabled-outline-opacity}" }
        icon: { fill: "{md.comp.icon-button.disabled-icon-color}", fillOpacity: "{md.comp.icon-button.disabled-icon-opacity}" }
