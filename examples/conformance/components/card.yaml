# yaml-language-server: $schema=../../../schema/component.schema.json
kind: Component
metadata: { id: card, name: Card, description: "Conformance: slot prop, column layout, absolute state layer, shadow, outside stroke" }
data:
  props:
    title:   { type: text, default: "{text.card.title}" }
    content: { type: slot, min: 1, max: 3, preferred: [button], preferredOnly: true, description: Card actions }
  states: [enabled, hovered]
  anatomy:
    root:
      kind: frame
      layout: { direction: column, gap: "{space.gap}", padding: ["{layout.card-padding}", "{layout.card-padding}", "{space.inset}", "{layout.card-padding}"], width: "{layout.card-width}", height: hug }
      children:
        stateLayer: { kind: frame, layout: { position: absolute, width: fill, height: fill } }
        heading:    { kind: text, text: { prop: title } }
        body:       { kind: slot, prop: content, layout: { direction: row, gap: "{space.gap}", width: fill } }
  styles:
    base:
      enabled:
        root:       { fill: "{color.surface}", cornerRadius: "{radius.medium}", shadow: "{elevation.1}", strokeColor: "{color.outline}", strokeWidth: "{stroke.thin}", strokeAlign: outside }
        stateLayer: { fill: "{color.on-surface}", opacity: "{opacity.none}", cornerRadius: "{radius.medium}" }
        heading:    { color: "{color.on-surface}", typography: "{type.body}" }
      hovered:
        stateLayer: { opacity: "{opacity.hover}" }
