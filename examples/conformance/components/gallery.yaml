# yaml-language-server: $schema=../../../schema/component.schema.json
kind: Component
metadata: { id: gallery, name: Gallery, description: "Conformance: grid, wrap, absolute badge, image, gradient fill, x-figma" }
data:
  props:
    caption: { type: text, default: "{text.gallery.caption}" }
  anatomy:
    root:
      kind: frame
      layout: { direction: column, gap: "{layout.gallery-gap}", padding: "{space.inset}", width: hug, height: hug }
      children:
        grid:
          kind: frame
          layout: { direction: grid, grid: { columns: 2, rows: 2 }, gap: "{layout.grid-gap}", crossGap: "{layout.grid-gap}" }
          children:
            photo: { kind: image, src: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='96' height='96'><rect width='96' height='96' fill='%23d0bcff'/></svg>" }
            badge: { kind: text, text: "{text.gallery.badge}" }
        tags:
          kind: frame
          layout: { direction: row, wrap: true, gap: "{space.xs}", crossGap: "{space.xs}", width: "{layout.tags-width}" }
          children:
            tagA: { kind: text, text: "{text.gallery.tag-a}" }
            tagB: { kind: text, text: "{text.gallery.tag-b}" }
            tagC: { kind: text, text: "{text.gallery.tag-c}" }
        caption: { kind: text, text: { prop: caption } }
  styles:
    base:
      enabled:
        root:    { fill: "{color.surface}", cornerRadius: ["{radius.medium}", "{radius.medium}", "{radius.none}", "{radius.none}"] }
        grid:    { fill: "{gradient.scrim}" }
        photo:   { width: "{size.thumb}", height: "{size.thumb}", cornerRadius: "{radius.small}" }
        badge:   { position: absolute, x: "{space.xs}", y: "{space.xs}", color: "{color.on-primary}", typography: "{type.label}" }
        caption: { color: "{color.on-surface}", typography: "{type.body}", textAlign: center }
  x-figma:
    parts:
      root: { blendMode: PASS_THROUGH, clipsContent: true }
