# button-style is chosen per instance by the button's `style` mode prop (no condition).
button:
  container-color: { $type: color, $value: "{color.primary}" }
  content-color: { $type: color, $value: "{color.on-primary}" }
  outline-color: { $type: color, $value: { colorSpace: srgb, components: [0, 0, 0], alpha: 0 } }
  outline-width: { $type: dimension, $value: { value: 0, unit: px } }
  shadow: { $type: shadow, $value: "{elevation.1}" }
